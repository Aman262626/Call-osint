services:
  - type: web
    name: call-osint
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: API_KEY
        sync: false
      - key: PORT
        value: "5000"
      - key: PYTHON_VERSION
        value: "3.11.0"
